name: Cleanup workflow runs

on:
  workflow_run:
    workflows:
      - Scheduled benchmark
      - CI
      - Mirror main to GitLab
      - Release verification
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: cleanup-workflow-runs
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete older completed workflow runs
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          current_workflow_id="$(
            gh api \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}" \
              --jq '.workflow_id'
          )"

          completed_runs="$(
            gh api --paginate \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GH_REPO}/actions/runs?status=completed&per_page=100" \
              --jq '.workflow_runs[] | [.created_at, .id, .workflow_id] | @tsv' |
              sort --reverse
          )"

          declare -A retained_workflow_ids=()
          retained_workflow_ids["$current_workflow_id"]=1

          while IFS=$'\t' read -r _created_at run_id workflow_id; do
            if [[ -z "$workflow_id" || -z "$run_id" ]]; then
              continue
            fi

            if [[ -z "${retained_workflow_ids[$workflow_id]:-}" ]]; then
              retained_workflow_ids["$workflow_id"]=1
              echo "Keeping latest completed run ${run_id} for workflow ${workflow_id}"
              continue
            fi

            echo "Deleting completed workflow run ${run_id}"
            gh api --method DELETE \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GH_REPO}/actions/runs/${run_id}"
          done <<< "$completed_runs"

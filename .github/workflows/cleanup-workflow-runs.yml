name: Cleanup workflow runs

on:
  workflow_run:
    workflows:
      - Scheduled benchmark
      - CI
      - Mirror to GitLab
      - Release verification
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: cleanup-workflow-runs
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retain only the latest completed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          cleanup_workflow_id="$(
            gh api \
              "repos/${GH_REPO}/actions/workflows/cleanup-workflow-runs.yml" \
              --jq '.id'
          )"

          mapfile -t workflow_ids < <(
            gh api --paginate \
              "repos/${GH_REPO}/actions/workflows?per_page=100" \
              --jq '.workflows[] | select(.state == "active") | .id'
          )

          for workflow_id in "${workflow_ids[@]}"; do
            mapfile -t run_ids < <(
              gh api --paginate \
                "repos/${GH_REPO}/actions/workflows/${workflow_id}/runs?status=completed&per_page=100" \
                --jq '.workflow_runs[] | [.created_at, .id] | @tsv' |
                sort -t $'\t' -k1,1r -k2,2nr |
                cut -f2
            )

            for index in "${!run_ids[@]}"; do
              if [[ "${workflow_id}" != "${cleanup_workflow_id}" && "${index}" -eq 0 ]]; then
                continue
              fi

              run_id="${run_ids[${index}]}"
              echo "Deleting completed run ${run_id} from workflow ${workflow_id}"
              gh api --method DELETE \
                "repos/${GH_REPO}/actions/runs/${run_id}"
            done
          done

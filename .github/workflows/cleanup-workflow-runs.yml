name: Cleanup workflow runs

on:
  workflow_run:
    workflows:
      - Scheduled benchmark
      - CI
      - Mirror to GitLab
      - Release verification
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: cleanup-workflow-runs
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete all completed workflow runs
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t completed_run_ids < <(
            gh api --paginate \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GH_REPO}/actions/runs?status=completed&per_page=100" \
              --jq '.workflow_runs[].id'
          )

          for run_id in "${completed_run_ids[@]}"; do
            echo "Deleting completed workflow run ${run_id}"
            gh api --method DELETE \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GH_REPO}/actions/runs/${run_id}"
          done

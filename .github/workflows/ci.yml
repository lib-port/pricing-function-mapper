name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests scripts
      - run: python -m black --check src tests scripts
      - run: python -m mypy src/pricing_mapper
      - run: PYTHONPATH=src python scripts/generate_schemas.py
      - run: git diff --exit-code -- schema

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - if: matrix.python-version == '3.11'
        run: python -m mypy src/pricing_mapper
      - if: matrix.python-version != '3.13'
        run: python -m pytest -q
      - if: matrix.python-version == '3.13'
        run: python -m pytest --cov=pricing_mapper --cov-branch --cov-report=xml
      - if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  distribution:
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install build twine pip-audit
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip_audit . --strict
      - run: scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: python -m ruff check src tests scripts
        language: system
        pass_filenames: false
      - id: black
        name: Black
        entry: python -m black --check src tests scripts
        language: system
        pass_filenames: false
      - id: mypy
        name: strict mypy
        entry: python -m mypy src/pricing_mapper
        language: system
        pass_filenames: false

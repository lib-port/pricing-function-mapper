name: pricing-function-mapper-ollama

x-ollama-image: &ollama-image "ollama/ollama:0.32.0@sha256:57f573b47f1f71ebb445789f279fe3e596a8beab182f7cf486db9205bad87c5a"
x-resource-limits: &resource-limits
  cpus: 2.0
  mem_limit: 8g
  pids_limit: 512

services:
  ollama:
    image: *ollama-image
    <<: *resource-limits
    restart: unless-stopped
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "5m"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - runtime
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama-provision:
    profiles: ["provision"]
    image: *ollama-image
    <<: *resource-limits
    restart: "no"
    command: ["serve"]
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - provisioning
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  ollama-models:

networks:
  runtime:
    internal: true
  provisioning:
    driver: bridge
